# Builds Vocab Ishtika for Android, Windows, macOS and iOS on GitHub's
# computers, and publishes the files on the Releases page.
#
# Runs when app code changes on main, when a version tag is pushed
# (git tag v1.0.1 && git push origin v1.0.1), or by hand from the
# Actions tab ("Run workflow").
name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'tool/setup.*'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup.sh
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup.sh
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk VocabIshtika-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: VocabIshtika-Android.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: powershell -ExecutionPolicy Bypass -File tool\setup.ps1
      - run: flutter build windows --release
      - name: Zip the Windows app
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath VocabIshtika-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: VocabIshtika-Windows.zip

  apple:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup.sh
      - run: flutter create --org com.ishtika --project-name vocab_ishtika --platforms=macos .
      - name: Build macOS app
        run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent vocab_ishtika.app "$GITHUB_WORKSPACE/VocabIshtika-macOS.zip"
      - name: Build iOS app (unsigned)
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr VocabIshtika-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            VocabIshtika-macOS.zip
            VocabIshtika-iOS-unsigned.ipa

  release:
    needs: [android, windows, apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: Vocab Ishtika ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          files: |
            VocabIshtika-Android.apk
            VocabIshtika-Windows.zip
            VocabIshtika-macOS.zip
            VocabIshtika-iOS-unsigned.ipa
          body: |
            ## Download Vocab Ishtika

            | Device | File | How to install |
            |---|---|---|
            | **Android** phone/tablet | `VocabIshtika-Android.apk` | Open it on the device and allow "Install unknown apps" when asked. |
            | **Windows** PC | `VocabIshtika-Windows.zip` | Unzip, then double-click `vocab_ishtika.exe`. If Windows SmartScreen warns, click **More info → Run anyway**. |
            | **Mac** | `VocabIshtika-macOS.zip` | Unzip, then **right-click → Open** the app the first time (it isn't notarized by Apple). |
            | **iPhone/iPad** | `VocabIshtika-iOS-unsigned.ipa` | Apple doesn't allow installing unsigned apps directly. Install from your Mac with Xcode instead (see README → "Install on an iPhone or iPad"). |

            Everything works offline. No account needed.
